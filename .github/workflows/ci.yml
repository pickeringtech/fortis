# The planned quick tier on every ready pull request, shared with gate.py --tier quick --changed BASE.
# Unknown paths and manual runs keep the whole quick tier; release.yml is unchanged.
# Pull requests open as drafts, and CI does not run on drafts: run the quick tier locally, then `gh pr ready`.
# The full tier runs at release tags (release.yml).
#
#   plan           classifies the merge-base diff using conformance/tools/ci_plan.py
#   build          compiles the toolchain once (Cargo's `ci` table: release semantics, quicker to compile) and
#                  hands the binaries to the shards
#   rust-tests     the Rust test suites, beside everything else
#   checks-python  the shards that need no compiled toolchain, from the start
#   checks         the other shards, also from the start: each runs the steps that need no toolchain (its
#                  prerequisites, mostly) while the build runs, then fetches the binaries and runs the rest
#   quick          one status: every planned job passed, and the shards covered the plan exactly once
#
# Actions are pinned to full commit SHAs, with the version they were taken from in a comment.
name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      cold:
        description: "Restore no cache (a cold run, to time one)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      build: ${{ steps.plan.outputs.build }}
      rust_tests: ${{ steps.plan.outputs.rust_tests }}
      python_matrix: ${{ steps.plan.outputs.python_matrix }}
      toolchain_matrix: ${{ steps.plan.outputs.toolchain_matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Plan the changed paths
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            python3 -I conformance/tools/ci_plan.py --full --json build/ci-plan.json --github-output "$GITHUB_OUTPUT"
          else
            python3 -I conformance/tools/ci_plan.py --base "$BASE_SHA" --head "$HEAD_SHA" --json build/ci-plan.json --github-output "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-plan
          path: build/ci-plan.json
          retention-days: 7

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Python unit tests (fail before compiling)
        run: python3 -I conformance/tools/unit_check.py --json
      # the runner image's own stable Rust; its version keys the cache, because GitHub rolls new images out
      # gradually and a cache built by another rustc would be rebuilt in full
      - id: rust
        run: rustc -V && cargo -V && echo "version=$(rustc -V | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      # compiler/target holds only Cargo's build state; cache_mtimes.py makes it usable across checkouts
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: ${{ !inputs.cold }}
        with:
          path: |
            compiler/target
            build/ci-cache
          key: build-${{ runner.os }}-rust${{ steps.rust.outputs.version }}-${{ hashFiles('compiler/**/*.rs', 'compiler/**/Cargo.toml', 'compiler/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            build-${{ runner.os }}-rust${{ steps.rust.outputs.version }}-${{ hashFiles('compiler/**/*.rs', 'compiler/**/Cargo.toml', 'compiler/Cargo.lock') }}-
            build-${{ runner.os }}-rust${{ steps.rust.outputs.version }}-
      # the cached outputs get one time and a source whose bytes are those the cached build saw an older one, so
      # Cargo reuses what it built from it; any other source gets a newer time, so Cargo rebuilds what depends on it
      - name: Give unchanged files their cached times back
        run: python3 -I .github/scripts/cache_mtimes.py restore
      - name: Build fortisc, fortisd and fortis-query-db
        run: cargo build --profile ci --manifest-path compiler/Cargo.toml -p fortisc -p fortis-query-db
      # the checks find the binaries where a local build puts them
      - name: Pack the binaries
        run: |
          mkdir -p dist/compiler/target/release
          cp compiler/target/ci/fortisc compiler/target/ci/fortisd compiler/target/ci/fortis-query-db dist/compiler/target/release/
          tar -C dist -cf tools.tar compiler
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tools
          path: tools.tar
          retention-days: 1
          compression-level: 1
      - name: Record the files' times for the next run's cache
        run: python3 -I .github/scripts/cache_mtimes.py save

  rust-tests:
    needs: plan
    if: needs.plan.outputs.rust_tests == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Python unit tests (fail before compiling)
        run: python3 -I conformance/tools/unit_check.py --json
      - id: rust
        run: rustc -V && cargo -V && echo "version=$(rustc -V | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: ${{ !inputs.cold }}
        with:
          path: |
            compiler/target
            build/ci-cache
          key: tests-${{ runner.os }}-rust${{ steps.rust.outputs.version }}-${{ hashFiles('compiler/**/*.rs', 'compiler/**/Cargo.toml', 'compiler/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            tests-${{ runner.os }}-rust${{ steps.rust.outputs.version }}-${{ hashFiles('compiler/**/*.rs', 'compiler/**/Cargo.toml', 'compiler/Cargo.lock') }}-
            tests-${{ runner.os }}-rust${{ steps.rust.outputs.version }}-
      - name: Give unchanged files their cached times back
        run: python3 -I .github/scripts/cache_mtimes.py restore
      # the gate's cargo-test step, in the ci table: cargo test leaves the query database's allocator test out, and
      # it runs on its own with one harness thread, once (compiler/query-db/tests/alloc_run.rs says why)
      - name: cargo test
        run: cargo test --profile ci --manifest-path compiler/Cargo.toml
      - name: cargo test, the allocator test
        run: cargo test --profile ci --manifest-path compiler/Cargo.toml -p fortis-query-db --test alloc -- --test-threads=1
      - name: Record the files' times for the next run's cache
        run: python3 -I .github/scripts/cache_mtimes.py save

  checks-python:
    needs: plan
    if: needs.plan.outputs.python_matrix != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.python_matrix) }}
    name: checks (${{ matrix.shard }})
    env:
      CI_PLAN: ${{ needs.plan.outputs.plan }}
      SHARDS: ${{ fromJSON(needs.plan.outputs.plan).shards }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # the whole history: where the delivery plan is present, its check verifies recorded commits
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Run the shard
        run: python3 -I conformance/tools/gate.py --tier quick --shard "${{ matrix.shard }}/$SHARDS" --ci-plan "$CI_PLAN" --json "build/gate-shard-${{ matrix.shard }}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: gate-shard-${{ matrix.shard }}
          overwrite: true  # a re-run attempt replaces its earlier report, so the combine step never reads a stale one
          path: build/gate-shard-${{ matrix.shard }}.json
          retention-days: 7
          if-no-files-found: ignore

  checks:
    needs: plan
    if: needs.plan.outputs.toolchain_matrix != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # actions: read, to fetch the build job's binaries from this run (.github/scripts/fetch_tools.py)
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.toolchain_matrix) }}
    name: checks (${{ matrix.shard }})
    env:
      CI_PLAN: ${{ needs.plan.outputs.plan }}
      SHARDS: ${{ fromJSON(needs.plan.outputs.plan).shards }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      # rustc and Cargo build the native programs the checks run: the runner image's own stable Rust
      - id: rust
        run: rustc -V && cargo -V && echo "version=$(rustc -V | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - name: Install Pillow (the website step draws the social-preview image)
        run: python3 -m pip install --quiet -r .github/requirements-ci.txt
      # the native backend's build directories: build state only, keyed by content or by Cargo's fingerprints; the
      # native check's results and the per-crate evidence files are reports, so they are left out
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: ${{ !inputs.cold }}
        with:
          path: |
            build/native-build
            build/native-prod
            !build/native-prod/results*.json
            !build/native-prod/*/evidence.json
            build/native-runtime
            build/ci-cache
          key: shard-${{ runner.os }}-rust${{ steps.rust.outputs.version }}-${{ matrix.shard }}of${{ env.SHARDS }}-${{ hashFiles('compiler/**/*.rs', 'compiler/**/Cargo.toml', 'compiler/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            shard-${{ runner.os }}-rust${{ steps.rust.outputs.version }}-${{ matrix.shard }}of${{ env.SHARDS }}-
      - name: Give unchanged files their cached times back
        run: python3 -I .github/scripts/cache_mtimes.py restore
      - name: Allow unprivileged user namespaces (the sandbox checks run the tools in a new namespace)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # the build job's binaries arrive when the shard first needs them (gate.py --toolchain), under a deadline
      - name: Run the shard
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I conformance/tools/gate.py --tier quick --shard "${{ matrix.shard }}/$SHARDS" --ci-plan "$CI_PLAN" --toolchain "python3 -I .github/scripts/fetch_tools.py" --json "build/gate-shard-${{ matrix.shard }}.json"
      - name: Record the files' times for the next run's cache
        run: python3 -I .github/scripts/cache_mtimes.py save
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: gate-shard-${{ matrix.shard }}
          overwrite: true  # a re-run attempt replaces its earlier report, so the combine step never reads a stale one
          path: build/gate-shard-${{ matrix.shard }}.json
          retention-days: 7
          if-no-files-found: ignore

  # the single status to require in branch protection
  quick:
    needs: [plan, build, rust-tests, checks-python, checks]
    if: always() && (github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI_PLAN: ${{ needs.plan.outputs.plan }}
      JOB_RESULTS: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: gate-shard-*
          path: build/shards
          merge-multiple: true
      - name: Combine the shards' reports
        run: python3 -I conformance/tools/gate.py --tier quick --ci-plan "$CI_PLAN" --combine build/shards/*.json --json build/gate.json
      - name: Every planned job passed
        if: always()
        run: |
          python3 - <<'PYTHON'
          import json, os
          needs = json.loads(os.environ["JOB_RESULTS"])
          assert needs["plan"]["result"] == "success", "plan failed or did not run"
          plan = json.loads(os.environ["CI_PLAN"])
          required = {"build": plan["build"], "rust-tests": plan["rust_tests"],
                      "checks-python": plan["py_shards"] > 0, "checks": plan["shards"] > plan["py_shards"]}
          for job, runs in required.items():
              actual, expected = needs[job]["result"], "success" if runs else "skipped"
              print(f"{job}: {actual} (expected {expected})")
              assert actual == expected, f"{job}: {actual}, expected {expected}"
          PYTHON
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: gate-report-quick
          path: build/gate.json
          retention-days: 30
          if-no-files-found: ignore
