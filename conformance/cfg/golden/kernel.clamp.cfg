cfg clamp entry=0 exit=1
B0:
  stmt if value < low
  places value, low
  -> B3 [true]
  -> B2 [false]
B1:
B2:
  stmt if value > high
  places value, high
  -> B5 [true]
  -> B4 [false]
B3:
  stmt return low
  places low
  -> B1 [return]
B4:
  stmt return value
  places value
  -> B1 [return]
B5:
  stmt return high
  places high
  -> B1 [return]
