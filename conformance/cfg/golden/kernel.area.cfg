cfg area entry=0 exit=1
B0:
  stmt match shape
  places shape
  -> B3 [Circle(radius : r)]
  -> B4 [Square(side : s)]
  -> B5 [Point]
B1:
B2:
  stmt return 0
  -> B1 [return]
B3:
  stmt let rr = r * r
  stmt give rr * 3
  places r, rr
  -> B2 [next]
B4:
  stmt s * s
  places s
  -> B2 [next]
B5:
  stmt 0
  -> B2 [next]
